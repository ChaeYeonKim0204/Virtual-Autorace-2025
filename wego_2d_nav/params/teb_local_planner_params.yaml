TebLocalPlannerRos:

  odom_topic: /odometry/filtered
  map_frame: map

  teb_autosize: True
  dt_ref: 0.3
  dt_hysteresis: 0.1
  global_plan_overwrite_orientation: True
  max_global_plan_lookahead_dist: 2.0
  feasibility_check_no_poses: 5

  max_vel_x: 2.0
  max_vel_x_backwards: 1.0
  max_vel_theta: 0.5
  acc_lim_x: 2
  acc_lim_theta: 2
  min_turning_radius: 0.755
  # wheelbase: 0.26

  footprint_model:
    type: "polygon"
    # radius: 0.2
    # line_start: [-0.3, 0.0]
    # line_end: [0.3, 0.0]
    # front_offset: 0.2
    # front_radius: 0.2
    # rear_offset: 0.2
    # rear_radius: 0.2
    vertices: [[-0.1, -0.1], [-0.1, 0.1], [0.3, 0.1], [0.3, -0.1]]
    # vertices: [[0.25, -0.05], [0.18, -0.05], [0.18, -0.18], [-0.19, -0.18], [-0.25,0], [-0.19, 0.18],[0.18,0.18],[0.18,0.05],[0.25,0.05]]

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.2
  free_goal_vel: false

  min_obstacle_dist: 0.25
  include_costmap_obstacles: True
  costmap_obstacles_behind_robot_dist: 0.7
  obstacle_poses_affected: 15
  costmap_converter_plugin: "costmap_converter::CostmapToPolygonsDBSMCCH"
  costmap_converter_spin_thread: True
  costmap_converter_rate: 5

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: True
  optimization_verbose: False
  penalty_epsilon: 0.1
  
  weight_max_vel_x: 2
  weight_max_vel_theta: 0.5
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 1 


